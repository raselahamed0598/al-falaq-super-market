<script>
const API_URL = "https://script.google.com/macros/s/AKfycbwZxAZASeYhD9Vo3v4eJxKVGy3vKx5XXY_luG3EKn3O7q12qmkFOTyZ56mWoDPoauFT/exec";

function addProduct() {

    const name = document.getElementById("productName").value.trim();
    const price = document.getElementById("productPrice").value;
    const image = document.getElementById("productImage").value.trim();
    const message = document.getElementById("message");

    if (name === "" || price === "") {
        message.innerText = "Please enter product name and price.";
        return;
    }

    message.innerText = "⏳ Adding product...";

    fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            name: name,
            price: Number(price),
            image: image
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.success) {
            message.innerText = "✅ Product added successfully!";

            document.getElementById("productName").value = "";
            document.getElementById("productPrice").value = "";
            document.getElementById("productImage").value = "";
        } else {
            message.innerText = "❌ Product could not be added.";
        }

    })
    .catch(error => {
        console.error(error);
        message.innerText = "❌ Connection error. Please try again.";
    });
}
</script>

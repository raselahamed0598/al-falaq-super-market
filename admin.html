<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AL FALAQ SUPER MARKET - Admin</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 500px;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
        }

        h1 {
            color: green;
            text-align: center;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 14px;
            background: green;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
        }

        #message {
            text-align: center;
            margin-top: 15px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🛒 AL FALAQ SUPER MARKET</h1>

    <h2>Admin Panel</h2>

    <input id="productName" type="text" placeholder="Product Name">

    <input id="productPrice" type="number" placeholder="Price (AED)">

    <input id="productImage" type="text" placeholder="Image URL">

    <button onclick="addProduct()">➕ Add Product</button>

    <div id="message"></div>

</div>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbwZxAZASeYhD9Vo3v4eJxKVGy3vKx5XXY_luG3EKn3O7q12qmkFOTyZ56mWoDPoauFT/exec";

function addProduct() {

    const name = document.getElementById("productName").value;
    const price = document.getElementById("productPrice").value;
    const image = document.getElementById("productImage").value;

    if (name === "" || price === "") {
        document.getElementById("message").innerText =
            "Please enter product name and price.";
        return;
    }

    document.getElementById("message").innerText =
        "⏳ Adding product...";

    fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({
            name: name,
            price: Number(price),
            image: image
        })
    })
    .then(response => response.json())
    .then(data => {

        if (data.success) {
            document.getElementById("message").innerText =
                "✅ Product added successfully!";

            document.getElementById("productName").value = "";
            document.getElementById("productPrice").value = "";
            document.getElementById("productImage").value = "";
        } else {
            document.getElementById("message").innerText =
                "❌ " + data.message;
        }

    })
    .catch(error => {

        console.log(error);

        document.getElementById("message").innerText =
            "❌ Connection error";
    });
}

</script>

</body>
</html>
